name: TechPulse Daily Digest

on:
  schedule:
    - cron: "17 10 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["scripts/**", "tests/**", "requirements.txt", ".github/workflows/**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: techpulse-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
      - name: Offline regression tests (no provider credentials)
        run: python -m unittest discover -s tests -v

  publish:
    needs: test
    if: (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Generate and validate the complete issue in staging
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-3.8-flash' }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_MODEL: ${{ vars.GROQ_MODEL || 'llama-3.3-70b-versatile' }}
        run: python scripts/run_daily.py
      - name: Publish all validated paths together
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- feeds/ archive/ INDEX.md STATS.md README.md STATUS.json
          if ! git diff --staged --quiet; then
            git commit -m "Publish complete TechPulse issue"
            git push origin HEAD:main
          fi
      - name: Record actual outcome
        if: always()
        env:
          OUTCOME: ${{ job.status }}
        run: |
          echo "Publication job: $OUTCOME. Only a successful push publishes a new issue." >> "$GITHUB_STEP_SUMMARY"
          echo "A failure leaves the last complete remote issue unchanged; see the failed step." >> "$GITHUB_STEP_SUMMARY"
